name: Feature request
description: Suggest a new feature or a change to existing behavior.
labels: ["enhancement"]
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        **Issues in public repositories are visible to anyone.** In examples, replace private file paths, pack and team names with placeholders like `packs/foo` and `TeamA`.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation or workflow, not just the feature. Knowing the use case helps us find the right fix.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you'd like it to work. Example config, commands, or output are welcome.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you're using now, or other approaches you looked at.
